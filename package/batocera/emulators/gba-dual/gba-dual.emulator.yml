features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
custom_features:
  gba_dual_layout:
    prompt: SPLIT LAYOUT
    description: Arrange the two GBA screens horizontally or vertically.
    choices:
      Horizontal (Default): "horizontal"
      Vertical: "vertical"
  gba_dual_link:
    prompt: LINK CABLE
    description: Enable the mGBA GBA multiplayer link backend.
    choices:
      Enabled (Default): "true"
      Disabled: "false"
  gba_dual_audio_pan:
    prompt: 2P AUDIO PANNING
    description: Spatial stereo audio separation for 2-player split screen.
    choices:
      Stereo Blend (Default): "blend"
      Hard Split (L/R): "split"
      Centered (Equal): "center"
systems:
  - gba2players
